# Kubernetes 环境配置
# 启用 K8s CRD 存储和分布式部署

clickhouse:
  host: "clickhouse-service"
  port: 9000
  username: "default"
  password: ""
  database: "default"
  flight_sql_endpoint: "clickhouse-service"
  flight_sql_port: 9090
  use_tls: true
  tls_cert_file: "/etc/ssl/certs/clickhouse-cert.pem"
  tls_key_file: "/etc/ssl/private/clickhouse-key.pem"
  tls_ca_file: "/etc/ssl/certs/ca-cert.pem"
  flight_timeout: "60s"
  batch_size: 20000
  compression_type: "zstd"

starrocks:
  host: "starrocks-fe-service"
  port: 9030
  username: "root"
  password: ""
  database: "test"
  flight_sql_endpoint: "starrocks-fe-service"
  flight_sql_port: 9090
  use_tls: true
  tls_cert_file: "/etc/ssl/certs/starrocks-cert.pem"
  tls_key_file: "/etc/ssl/private/starrocks-key.pem"
  tls_ca_file: "/etc/ssl/certs/ca-cert.pem"
  flight_timeout: "60s"
  batch_size: 20000
  compression_type: "zstd"
  max_idle_conns: 20
  max_open_conns: 200
  conn_max_lifetime: "2h"

global_concurrency:
  max_workers: 5
  max_concurrent_tasks: 3
  batch_size: 5000

sync_tasks:
  - task_id: "production_sync"
    name: "生产环境数据同步"
    description: "生产环境数据同步任务"
    enabled: true
    source_table: "events"
    target_table: "events_sync"

    data_range:
      time_column: "timestamp"
      where: "event_type IN ('click', 'view', 'purchase')"

    time_window:
      start_time: "02:00"
      end_time: "06:00"

    rate_limit:
      max_bytes_per_second: 52428800  # 50MB/s
      max_rows_per_second: 50000

    validate:
      enabled: true
      check_row_count: true
      check_checksum: true
      tolerance_percent: 1.0

    cron_expression: "0 3 * * *"

monitor:
  enabled: true
  metrics_port: 8080
  health_check_port: 8081

# 启用 Kubernetes 集成
kubernetes:
  enabled: true
  namespace: "ck2sr"
  configmap_name: "ck2sr-config"
  crd_name: "ck2sr-tasks"
  label_selector: "app=ck2sr"

log:
  level: "info"
  format: "json"
  output: "stdout"

storage_path: "/data"
heartbeat_interval: "30s"
graceful_shutdown_timeout: "60s"