# ck2sr 配置文件 v2.0
# ClickHouse 数据库配置
clickhouse:
  - name: myck-1
    mysql: # MySQL协议接入配置（用于数据导出）
      host: "localhost"
      port: 9004
      username: "default"
      password: ""
      timeout: "30s"
    http: # HTTP协议接入配置（用于Stream Load数据导入）
      host: "localhost"
      port: 8123
      username: "default"
      password: ""
      timeout: "30s"

# StarRocks 数据库配置
starrocks:
  - name: mysr-1
    mysql: # MySQL协议接入配置（用于数据导出，备用方案）
      host: "localhost"
      port: 9030
      username: "root"
      password: ""
      timeout: "30s"
    flightsql: # Arrow Flight SQL协议接入配置（用于数据导出）
      host: "localhost"
      port: 9408
      username: "root"
      password: ""
      timeout: "30s"
      tls:
        enabled: false
        cert_file: ""
        key_file: ""
        ca_file: ""
        skip_verify: false
    http: # HTTP协议接入配置（用于Stream Load数据导入）
      host: "localhost"
      port: 8030
      username: "root"
      password: ""
      timeout: "30s"

# 同步任务配置
sync_tasks:
  - task_id: "ck2sr_demo_001"
    name: "ClickHouse到StarRocks演示同步"
    enabled: true
    priority: 1
    reader:
      name: "myck-1"          # 引用ClickHouse实例
      vendor: "clickhouse"    # 新增：厂商标识
      protocol: "mysql"       # 使用MySQL协议导出
      database: "test"
      tables:                 # 支持多张表同步
        - "orders"
        - "users"
    writer:
      name: "mysr-1"          # 引用StarRocks实例
      vendor: "starrocks"     # 新增：厂商标识
      protocol: "http"        # 使用HTTP Stream Load导入
      database: "test"
      tables:                 # 目标表列表，与源表一一对应
        - "orders_sync"
        - "users_sync"
    settings:
      data_range:
        time_column: "created_at"
        start_time: "2024-01-01 00:00:00"
        end_time: ""          # 空表示同步到最新数据
      time_window:
        start_time: ""      # 清空时间窗口限制
        end_time: ""
      rate_limit:
        max_bytes_per_second: 52428800    # 50MB/s 总限制
        max_rows_per_second: 50000        # 总行数限制
        burst_size: 1000
      retry:
        max_retries: 3
        initial_delay: "2s"
        max_delay: "60s"
        backoff_factor: 2.0
      column_mapping:          # 全局列映射
        user_id: "id"
        create_time: "created_at"
      batch_size: 10000        # 批处理大小
      batch_interval: "5s"     # 批次间隔时间
      parallel_tables: 2       # 并行处理表的数量

# 全局策略配置
policy:
  # 数据传输策略
  transfer:
    batch_size: 10000                # 批次大小
    batch_interval: "5s"             # 批次间隔时间
    progress_report_every: 10        # 每N批次输出进度
    progress_report_timeout: "10s"   # 或超过N秒强制输出进度
    rate_limit_sleep: "10ms"         # 速率控制休眠时间
    writer_concurrency: 3            # Writer并发数量（新增）

  # 调度策略
  schedule:
    check_interval: "1m"       # 时间窗口检查间隔
    retry_interval: "5m"       # 失败重试间隔
    max_concurrent_task: 2     # 最大并发任务数

  # HTTP客户端策略
  http:
    timeout: "30s"                   # 请求超时
    idle_conn_timeout: "60s"         # 空闲连接超时
    tls_handshake_timeout: "10s"     # TLS握手超时
    max_idle_conns: 100              # 最大空闲连接数
    max_conns_per_host: 10           # 每个主机最大连接数

  # 数据过滤策略
  filter:
    # 需要排除的列（全局配置，可在任务级别覆盖）
    exclude_columns: []
      # - "requestHeadIps"
      # - "requestBodyIps"
      # - "urlDomain"

    # 固定值列（全局配置，临时方案）
    fixed_values: {}
      # recordTimestamp: 1740924169

  # 重试策略（全局默认）
  retry:
    max_retries: 3
    initial_delay: "2s"
    max_delay: "60s"
    backoff_factor: 2.0

# 监控配置
monitor:
  enabled: false  # 暂时禁用，因为监控模块还未实现
  metrics_port: 8080
  metrics_path: "/metrics"
  update_interval: "10s"
  health_check_port: 8081

# 日志配置
log:
  level: "info"                # debug, info, warn, error
  format: "text"               # json, text
  output: "stdout"             # stdout, file
  file_path: "/var/log/ck2sr/ck2sr.log"
  max_size: 100               # MB
  max_backups: 10
  max_age: 30                 # days
  compress: true

# 服务运行配置
service:
  storage_path: "./data"
  heartbeat_interval: "30s"
  graceful_shutdown_timeout: "30s"
  max_concurrent_tasks: 5