# 双重认证配置示例
# 演示 SQL 连接和 Flight SQL 连接使用不同的认证信息

# ClickHouse 数据库配置
clickhouse:
  host: "localhost"
  port: 9000
  # SQL 连接认证（用于元数据查询）
  username: "default"
  password: ""
  database: "default"

  # Flight SQL 配置（用于数据传输）
  flight_sql_endpoint: "localhost"
  flight_sql_port: 9090
  flight_sql_auth:
    # Flight SQL 独立认证，可以与 SQL 连接不同
    username: "flight_user"
    password: "flight_password"
  use_tls: false
  flight_timeout: "30s"
  batch_size: 10000
  compression_type: "lz4"

# StarRocks 数据库配置
starrocks:
  host: "localhost"
  port: 9030
  # MySQL 连接认证（用于元数据查询）
  username: "root"
  password: "mysql_password"
  database: "test"

  # Flight SQL 配置（用于数据传输）
  flight_sql_endpoint: "localhost"
  flight_sql_port: 9090
  flight_sql_auth:
    # Flight SQL 独立认证，可以与 MySQL 连接不同
    username: "flight_admin"
    password: "flight_admin_password"
  use_tls: false
  flight_timeout: "30s"
  batch_size: 10000
  compression_type: "lz4"

# 简化的全局配置
global_rate_limit:
  max_bytes_per_second: 52428800  # 50MB/s
  max_rows_per_second: 50000

global_concurrency:
  max_workers: 2
  max_concurrent_tasks: 1

# 示例同步任务
sync_tasks:
  - task_id: "demo_sync"
    name: "双重认证演示任务"
    description: "使用双重认证进行数据同步"
    enabled: false
    source_table: "demo_table"
    target_table: "demo_table_copy"

    validate:
      enabled: true
      check_row_count: true
      tolerance_percent: 1.0

monitor:
  enabled: true
  metrics_port: 8080

log:
  level: "info"
  format: "json"
  output: "stdout"